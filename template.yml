AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DynamoDB only - Virtual Assistant (SAM)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 600
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref VirtualAssistantTable

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Deployment stage name

Resources:
  VirtualAssistantTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "tbl_ddb_virtual_assistant_${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  
    # -----------------------
  # Lambda Function (python 12)
  # -----------------------
  VirtualAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "fn-virtual-assistant-${Stage}"
      CodeUri: .
      Handler: stack_backend_lambda_light_etl/lambda_function.py.lambda_handler
      Description: Virtual Assistant API handler
      Layers:
        - arn:aws:lambda:us-east-1:336392948345:layer:AWSSDKPandas-Python312:15
      Environment:
        Variables:
          KB_S3_ECOMM_PATH: datasets/output/v1
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::genai-bedrock-udemy-virginia-01"
                - "arn:aws:s3:::genai-bedrock-udemy-virginia-01/*"

 #-----------------------
 # Lambda para registro de ventas
 #------------------------
  AwsSalesStoreOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 30
      FunctionName: !Sub "fn-sales-store-orders-${Stage}"
      CodeUri: .
      Handler: stack_frontend_ddb_lambda/lambda_function.py:lambda_handler
      Description: Lambda function to register sales orders
      Layers:
        - arn:aws:lambda:us-east-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python312-x86_64:2
      Environment:
        Variables:
          TABLE_NAME: !Ref VirtualAssistantTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref VirtualAssistantTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
                - dynamodb:DescribeTable
              Resource: !GetAtt VirtualAssistantTable.Arn
            
Outputs:
  TableName:
    Description: DynamoDB table name
    Value: !Ref VirtualAssistantTable
  TableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt VirtualAssistantTable.Arn
  FunctionName:
    Description: Lambda function name
    Value: !Ref VirtualAssistantFunction
