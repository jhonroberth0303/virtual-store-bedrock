AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DynamoDB only - Virtual Assistant (SAM)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Deployment stage name

Resources:
  VirtualAssistantTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "tbl_ddb_virtual_assistant_${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  TableName:
    Description: DynamoDB table name
    Value: !Ref VirtualAssistantTable
  TableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt VirtualAssistantTable.Arn
